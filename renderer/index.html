<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; font-src 'self' data: file:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
  <title>YuviXterm</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Sessions</span>
        <button id="add-session" title="New session">＋</button>
      </div>
      <div class="search-wrap"><input id="session-search" type="text" placeholder="Search hosts…" autocomplete="off" spellcheck="false" /></div>
      <div id="session-list"></div>
    </aside>
    <section id="workspace">
      <div id="topbar">
        <div id="tabbar"></div>
        <button id="term-interrupt" title="Interrupt the running command (sends Ctrl+C)">⛔ Ctrl-C</button>
        <button id="term-eof" title="Send Ctrl+Z (suspend) to the running command">Ctrl-Z</button>
        <button id="files-toggle" title="Toggle file browser (SFTP)">⊞ Files</button>
      </div>
      <div id="stage">
        <div id="terminals"></div>
        <div id="files-splitter" hidden></div>
        <div id="files-dock" hidden></div>
      </div>
      <!-- Status strip (MobaXterm-style): host · CPU% · CPU history · RAM · ↑tx · ↓rx · uptime · user · one cell per mount -->
      <div id="monitor">
        <span class="ms" data-k="host" title="Session">
          <svg class="mi mi-host" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="12" rx="3"/><path d="M4.5 6l2.5 2-2.5 2M8 10.5h3.5" stroke="#fff" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="mv" id="mon-host">—</span>
        </span>
        <span class="ms" data-k="cpu" title="CPU">
          <svg class="mi mi-cpu" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/><rect x="6" y="6" width="4" height="4" fill="#0d1117"/><path d="M6 1v2M8 1v2M10 1v2M6 13v2M8 13v2M10 13v2M1 6h2M1 8h2M1 10h2M13 6h2M13 8h2M13 10h2" stroke="currentColor" stroke-width="1.2"/></svg>
          <span class="mv" id="mon-cpu">—</span>
        </span>
        <span class="ms ms-graph" title="CPU history"><canvas id="mon-graph" width="56" height="16"></canvas></span>
        <span class="ms" data-k="ram" title="Memory used / total">
          <svg class="mi mi-ram" viewBox="0 0 16 16"><rect x="1" y="4" width="14" height="7" rx="1"/><path d="M3 11v2M6 11v2M9 11v2M12 11v2" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 6.5h2v2h-2zM7 6.5h2v2H7zM10.5 6.5h2v2h-2z" fill="#0d1117"/></svg>
          <span class="mv" id="mon-ram">—</span>
        </span>
        <span class="ms" data-k="tx" title="Upload">
          <svg class="mi mi-tx" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 6L8 2.5 11.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 13.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55"/></svg>
          <span class="mv" id="mon-tx">—</span>
        </span>
        <span class="ms" data-k="rx" title="Download">
          <svg class="mi mi-rx" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 13.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55"/></svg>
          <span class="mv" id="mon-rx">—</span>
        </span>
        <span class="ms" data-k="up" title="Uptime">
          <svg class="mi mi-up" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 14h5M8 11v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4 8l2-2.5 1.5 1.5L10 4.5 12 7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/></svg>
          <span class="mv" id="mon-up">—</span>
        </span>
        <span class="ms" data-k="user" title="User">
          <svg class="mi mi-user" viewBox="0 0 16 16"><circle cx="8" cy="5" r="3"/><path d="M2 14.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5z"/></svg>
          <span class="mv" id="mon-user">—</span>
        </span>
        <span id="mon-disks"></span>
      </div>
    </section>
  </div>
  <div id="modal-root"></div>
  <div id="disk-tip" class="mon-tip" hidden></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="file-browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
