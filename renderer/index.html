<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; font-src 'self' data: file:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
  <title>SSH</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Sessions</span>
        <button id="add-session" title="New session">＋</button>
      </div>
      <div class="search-wrap"><input id="session-search" type="text" placeholder="Search hosts…" autocomplete="off" spellcheck="false" /></div>
      <div id="session-list"></div>
    </aside>
    <section id="workspace">
      <div id="topbar">
        <div id="tabbar"></div>
        <button id="term-interrupt" title="Interrupt the running command (sends Ctrl+C)">⛔ Ctrl-C</button>
        <button id="term-eof" title="Send Ctrl+Z (suspend) to the running command">Ctrl-Z</button>
        <button id="files-toggle" title="Toggle file browser (SFTP)">⊞ Files</button>
      </div>
      <div id="stage">
        <div id="terminals"></div>
        <div id="files-splitter" hidden></div>
        <div id="files-dock" hidden></div>
      </div>
      <div id="monitor">
        <div class="mon-graphs">
          <div class="gcell" data-k="cpu"><div class="gh"><span class="gk">CPU</span><span class="gv">—</span></div><canvas class="spark"></canvas></div>
          <div class="gcell" data-k="ram"><div class="gh"><span class="gk">MEM</span><span class="gv">—</span></div><canvas class="spark"></canvas></div>
          <div class="gcell" data-k="net"><div class="gh"><span class="gk">NET</span><span class="gv">—</span></div><canvas class="spark"></canvas></div>
          <div class="gcell" data-k="disk"><div class="gh"><span class="gk">DISK</span><span class="gv">—</span></div><div class="gbar"><span class="track"><i></i></span></div></div>
        </div>
        <div class="mon-info">
          <div class="istack">
            <div class="irow"><span class="ik">LOAD</span><span class="iv" id="mon-load">—</span></div>
            <div class="irow"><span class="ik">UP</span><span class="iv" id="mon-up">—</span></div>
          </div>
          <div class="conn-chip"><span class="cdot"></span><span class="ch" id="mon-host">—</span><span class="cu" id="mon-user"></span></div>
        </div>
      </div>
    </section>
  </div>
  <div id="modal-root"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="file-browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
